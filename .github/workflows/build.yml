name: build

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"
      - run: bash android/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: LogiSync-android
          path: android/build/LogiSync.apk
      - if: github.event_name == 'release'
        run: gh release upload "${{ github.event.release.tag_name }}" android/build/LogiSync.apk --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile desktop/logisync/*.py tools/*.py
